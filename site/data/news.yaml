- id: news-002
  title_html: <a href="https://doi.org/10.1021/jacs.6c08238" style="color:inherit;text-decoration:none">Visualizing Millisecond
    Atomic Dynamics of Nanocrystals in Liquid</a>
  image_url: https://alivisatoslab.uchicago.edu/files/2026/10/toc-jacs-6c08238.jpg
  image_alt: 'Table of contents graphic: structural fluctuation of gold nanocrystals in a reactive liquid environment'
  image_fit: contain
  template_html: '<article aria-labelledby="news-item-2" style="border:1px solid #e7e2e2;border-top:4px solid #800000;background:#fff;display:flex;flex-direction:column"><img src="@@IMAGE_URL@@" alt="@@IMAGE_ALT@@" loading="lazy" style="display:block;width:100%;height:220px;object-fit:cover"><div
    style="padding:20px 22px 22px;display:flex;flex:1;flex-direction:column"><p style="margin:0 0 9px;color:#800000;font-size:.88rem;font-weight:600;letter-spacing:.035em;text-transform:uppercase"><time
    datetime="2026-06-18">June 18, 2026</time></p><h2 id="news-item-2" style="margin:0 0 11px;color:#333;font-size:1.28rem;line-height:1.3">@@TITLE_HTML@@</h2><p
    style="margin:0 0 17px;line-height:1.65">Our new <em>Journal of the American Chemical Society</em> paper uses millisecond-speed
    liquid-cell electron microscopy and deep-learning denoising to observe atomic-scale dynamics in gold nanocrystals in reactive
    liquids. The study reveals reversible changes in local crystallinity and how nanocrystal–liquid interactions affect dissolution
    and grain-boundary relaxation.</p><p style="margin:0 0 12px"><small>TOC graphic reprinted with permission from Kang,
    S. et al. J. Am. Chem. Soc. 2026, 148, 26845–26853. Copyright 2026 American Chemical Society.</small></p><p style="margin:auto 0 0"><a href="https://doi.org/10.1021/jacs.6c08238" style="color:#800000;font-weight:600;text-decoration:underline">Read
    the paper</a></p></div></article>'
  source_url: https://doi.org/10.1021/jacs.6c08238
  verified: true
  publish: true
- id: news-003
  title_html: Article featured on the cover of <em>Nature Synthesis</em>
  image_url: https://alivisatoslab.uchicago.edu/files/2026/05/3110.jpg
  image_alt: Cover image for the May 2026 issue of Nature Synthesis featuring group-III arsenide nanocube research
  template_html: '<article aria-labelledby="news-item-3" style="border:1px solid #e7e2e2;border-top:4px solid #800000;background:#fff;display:flex;flex-direction:column"
    class="img"><img src="@@IMAGE_URL@@" alt="@@IMAGE_ALT@@" loading="lazy" style="display:block;width:100%;height:220px;object-fit:cover"><div
    style="padding:20px 22px 22px;display:flex;flex:1;flex-direction:column"><p style="margin:0 0 9px;color:#800000;font-size:.88rem;font-weight:600;letter-spacing:.035em;text-transform:uppercase"><time
    datetime="2026-03-11">Published March 11, 2026; featured on the cover of the May 2026 issue</time></p><h2 id="news-item-3"
    style="margin:0 0 11px;color:#333;font-size:1.28rem;line-height:1.3">@@TITLE_HTML@@</h2><p style="margin:0 0 17px;line-height:1.65">Our
    article, “Kinetic-controlled transformations of group-III arsenide nanocubes,” reports the cation-exchange transformation
    of Cu<sub>3</sub>As nanocubes into InAs and GaAs. The work shows how reaction kinetics guide nucleation, phase propagation,
    symmetry changes, and the formation of crystalline, multidomain, amorphous, or hollow structures.</p><p style="margin:auto
    0 0"><a href="https://www.nature.com/articles/s44160-026-01015-6" style="color:#800000;font-weight:600;text-decoration:underline">Read
    the paper</a> <span aria-hidden="true">·</span> <a href="https://www.nature.com/natsynth/volumes/5/issues/5" style="color:#800000;font-weight:600;text-decoration:underline">View
    the May issue</a></p></div></article>'
  source_url: https://www.nature.com/natsynth/volumes/5/issues/5
  verified: true
  publish: true
