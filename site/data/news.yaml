- id: news-008
  title_html: Recreating George Washington Carver’s blue pigment
  image_url: https://alivisatoslab.uchicago.edu/files/2026/10/carver-blue-pigment-fecl3.jpg
  image_alt: Gloved hands add a solution to a flask of iron(III) chloride in water, where a blue-green pigment forms
  template_html: '<article aria-labelledby="news-item-8" style="border:1px solid #e7e2e2;border-top:4px solid #800000;background:#fff;display:flex;flex-direction:column"><img src="@@IMAGE_URL@@" alt="@@IMAGE_ALT@@" loading="lazy" style="display:block;width:100%;height:220px;object-fit:cover"><div style="padding:20px 22px 22px;display:flex;flex:1;flex-direction:column"><p style="margin:0 0 9px;color:#800000;font-size:.88rem;font-weight:600;letter-spacing:.035em;text-transform:uppercase"><time
    datetime="2025-06-27">June 27, 2025</time></p><h2 id="news-item-8" style="margin:0 0 11px;color:#333;font-size:1.28rem;line-height:1.3">@@TITLE_HTML@@</h2><p
    style="margin:0 0 17px;line-height:1.65">In collaboration with artist Amanda Williams, our team adapted a century-old
    pigment recipe patented by George Washington Carver. Safer acids and modern equipment helped make the Prussian blue pigment
    reproducibly in hours.</p><p style="margin:auto 0 0"><a href="https://news.uchicago.edu/story/chemistry-students-partner-artist-recreate-pigment-patented-george-washington-carver"
    style="color:#800000;font-weight:600;text-decoration:underline">Read the UChicago story</a></p></div></article>'
  source_url: https://news.uchicago.edu/story/chemistry-students-partner-artist-recreate-pigment-patented-george-washington-carver
  verified: true
  publish: true
