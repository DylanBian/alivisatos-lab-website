<style>
#alivisatos-publications [hidden]{display:none!important}#ap-publication-tools{margin:1.5rem 0 2rem}#ap-publication-tools label{display:block;font-weight:600;margin-bottom:.5rem}#ap-publication-tools .ap-search-row{display:flex;gap:.5rem;flex-wrap:wrap}#ap-publication-search{flex:1 1 16rem;min-width:0;padding:.75rem;border:1px solid #aaa;border-radius:4px;font:inherit}#ap-publication-tools button{padding:.7rem 1rem;border:1px solid #800000;border-radius:4px;background:#800000;color:#fff;font:inherit;cursor:pointer}#ap-search-status{display:block;margin-top:.5rem;color:#555}
</style>
<script>
(function(){function init(){var root=document.getElementById('alivisatos-publications');if(!root)return;var tools=root.querySelector('#ap-publication-tools');if(!tools||tools.querySelector('input'))return;tools.innerHTML='<label for="ap-publication-search">Search publications by title, author, journal, or DOI</label><div class="ap-search-row"><input id="ap-publication-search" type="search" placeholder="e.g. nanocrystal, Alivisatos, or a DOI" autocomplete="off" aria-controls="alivisatos-publications"><button type="button">Clear</button></div><span id="ap-search-status" role="status" aria-live="polite"></span>';var input=tools.querySelector('input'),clear=tools.querySelector('button'),status=tools.querySelector('[role="status"]'),years=Array.from(root.querySelectorAll('.ap-year-toggle')),selected=root.querySelector('.ap-selected');var sections=years.map(function(section){return{el:section,open:section.open,cards:Array.from(section.querySelectorAll('.ap-card')).map(function(card){return{el:card,text:card.textContent.toLowerCase()}})}});var total=sections.reduce(function(n,s){return n+s.cards.length},0);function filter(){var q=input.value.trim().toLowerCase(),words=q.split(/ +/).filter(Boolean),count=0;sections.forEach(function(section){var hits=0;section.cards.forEach(function(card){var match=words.every(function(word){return card.text.indexOf(word)!==-1});card.el.hidden=!match;if(match)hits++});section.el.hidden=!!q&&!hits;section.el.open=q?hits>0:section.open;count+=hits});if(selected)selected.hidden=!!q;root.querySelector('.ap-nav').hidden=!!q;status.textContent=q?count+' of '+total+' publications match your search.':total+' publications. Type to filter the list.'}input.addEventListener('input',filter);clear.addEventListener('click',function(){input.value='';filter();input.focus()});filter()}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init()})();
</script>
