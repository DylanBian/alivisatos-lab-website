name: Publish page

# Always run with mode = dry-run first and read the diff in the run summary.
# Then run again with mode = publish to write the same page.
on:
  workflow_dispatch:
    inputs:
      page:
        description: "Page to publish"
        type: choice
        options: [members, alumni, publications, research, news, home, all]
      mode:
        description: "dry-run shows the diff only; publish writes to WordPress"
        type: choice
        options: [dry-run, publish]
        default: dry-run

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      WP_USER: ${{ secrets.WP_USER }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Auth check
        run: python scripts/auth_check.py
      - name: Backup all pages
        run: python scripts/backup.py --out backup
      - name: Build and validate
        run: |
          python site/build.py
          python site/validate.py
      - name: Diff and push
        run: |
          PAGES="${{ inputs.page }}"
          if [ "$PAGES" = "all" ]; then PAGES="research news home members alumni publications"; fi
          FLAG=""
          if [ "${{ inputs.mode }}" = "publish" ]; then FLAG="--apply"; fi
          FAILED=""
          DONE=""
          for p in $PAGES; do
            if python site/push.py "$p" $FLAG; then
              python scripts/review_diff.py "$p"
              DONE="$DONE $p"
            else
              FAILED="$p"
              echo "**$p: push.py stopped; later pages were not touched.**" >> "$GITHUB_STEP_SUMMARY"
              break
            fi
          done
          echo "DONE=$DONE" >> "$GITHUB_ENV"
          if [ -z "$FLAG" ]; then
            echo "Dry run only. Re-run with mode = publish to write." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$FAILED" ]; then echo "::error title=Stopped at::$FAILED (done before it:$DONE)"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backup-and-diffs-${{ github.run_id }}
          path: |
            backup/
            site/backup/
            site/reports/*.diff
          retention-days: 90
      - name: Round-trip report
        if: ${{ always() && inputs.mode == 'publish' }}
        run: |
          PAGES="${{ inputs.page }}"
          if [ "$PAGES" = "all" ]; then PAGES="news home members alumni publications"; fi
          if [ "$PAGES" != "research" ]; then python scripts/roundtrip_report.py $PAGES; fi
      - name: Public check (cache may lag up to an hour)
        if: ${{ inputs.mode == 'publish' }}
        run: |
          sleep 30
          python scripts/verify_public.py --no-fail
