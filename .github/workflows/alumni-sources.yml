name: Collect alumni sources

# Reads OpenAlex and public ORCID records for alumni who co-authored group papers and commits
# site/data/metadata/alumni_sources.enc (encrypted; for review only). Changes nothing on the website.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyyaml cryptography
      - run: python scripts/alumni_sources.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/metadata/alumni_sources.enc
          git commit -m "Alumni sources from OpenAlex and ORCID (encrypted)" || echo "No changes"
          git pull --rebase origin main
          git push origin HEAD:main
